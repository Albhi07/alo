<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <meta name="description" content="আলো: SSC ২০২৭ প্রস্তুতির জন্য বিনামূল্যের, অফলাইনে চলা পাঠ ও অনুশীলন" />
    <title>আলো</title>
    <style>.boot{background:#14213d}.dark .boot{background:#0b1224}</style>
    <script>
      // Apply saved theme before paint to avoid a flash.
      try {
        var t = localStorage.getItem('alo.theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('alo.lang');
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!-- Painted before the app's JS arrives; React replaces it. Matches the real header. -->
      <div class="boot" style="position:sticky;top:0;color:#fff"><div style="max-width:36rem;margin:0 auto;height:3.5rem;display:flex;align-items:center;gap:.5rem;padding:0 1rem;font:600 1.25rem/1 'Hind Siliguri',system-ui,sans-serif"><img src="/icon.svg" alt="" width="28" height="28" /><span>আলো</span></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
